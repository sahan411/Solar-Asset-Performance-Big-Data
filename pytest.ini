[pytest]
# Put the repository root on sys.path so `processing`, `storage` and (later)
# `api` import cleanly regardless of which test directory is being run.
pythonpath = .

# Import test modules by their full path rather than by basename. Without this,
# two members' test files sharing a basename (tests/batch/test_reference.py and
# tests/simulators/test_reference.py) collide on the module name `test_reference`
# and collection fails. importlib mode keeps them distinct without requiring
# __init__.py in every test directory.
addopts = --import-mode=importlib

markers =
    integration: requires live infrastructure (PostgreSQL, Kafka, MinIO). Skipped unless the relevant *_TEST_* env var is set.
    spark: starts a local SparkSession; slower than a plain unit test.
