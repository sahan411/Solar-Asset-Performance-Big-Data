[pytest]
# Put the repository root on sys.path so `processing`, `storage` and (later)
# `api` import cleanly regardless of which test directory is being run.
pythonpath = .

markers =
    integration: requires live infrastructure (PostgreSQL, Kafka, MinIO). Skipped unless the relevant *_TEST_* env var is set.
    spark: starts a local SparkSession; slower than a plain unit test.
