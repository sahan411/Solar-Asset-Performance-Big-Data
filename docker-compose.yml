# Smart Grid Energy Monitoring & Billing: the whole pipeline in one command.
#
#   docker compose up -d --build
#
# Credentials below are local demo values only (grid/grid, admin/admin).

x-sim-env: &sim-env
  SIM_DAY_SECONDS: "300"        # 1 simulated day = 5 real minutes
  SIM_START_DATE: "2026-01-01"  # first simulated day
  SIM_SEED: "42"                # same seed -> same data every run
  SIM_CLOCK_FILE: /data/sim_clock_origin.txt
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: meter-readings

services:
  # ---------------------------------------------------------------- storage
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grid
      POSTGRES_PASSWORD: grid
      POSTGRES_DB: smartgrid
    ports: ["5432:5432"]
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid -d smartgrid"]
      interval: 5s
      retries: 20

  # -------------------------------------------------------------- ingestion
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # kafka:9092 for containers, localhost:29092 for tools running on your machine
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30

  # Creates the topic once: 3 partitions, messages keyed by meter_id.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    command: >-
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic meter-readings --partitions 3 --replication-factor 1
    restart: "no"

  # ------------------------------------------------------------ data sources
  meter-simulator:
    build: { context: ., dockerfile: simulators/Dockerfile }
    command: ["python", "-m", "simulators.meter_stream"]
    environment: *sim-env
    volumes: ["./data:/data"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  tariff-simulator:
    build: { context: ., dockerfile: simulators/Dockerfile }
    command: ["python", "-m", "simulators.tariff_batch"]
    environment:
      <<: *sim-env
      DATA_DIR: /data
    volumes: ["./data:/data"]
    restart: unless-stopped

  # ----------------------------------------------------------- speed layer
  spark-streaming:
    build: { context: ., dockerfile: spark/Dockerfile }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: meter-readings
      PG_DSN: host=postgres dbname=smartgrid user=grid password=grid
      LOW_RENEWABLE_PCT: "20"
    volumes: ["spark-checkpoints:/checkpoints"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ----------------------------------------------------------- batch layer
  airflow:
    image: apache/airflow:2.10.3-python3.11
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://grid:grid@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "10"
      AIRFLOW__WEBSERVER__SECRET_KEY: smart-grid-demo
      SMARTGRID_DB_DSN: host=postgres dbname=smartgrid user=grid password=grid
      SMARTGRID_DATA_DIR: /opt/airflow/data
      PYTHONPATH: /opt/airflow  # so DAGs can import common/
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./common:/opt/airflow/common
      - ./data:/opt/airflow/data
    ports: ["8080:8080"]
    command: >-
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin --firstname Admin
      --lastname User --role Admin --email admin@example.com || true) &&
      (airflow scheduler &) &&
      exec airflow webserver"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # --------------------------------------------------------- serving layer
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      PG_DSN: host=postgres dbname=smartgrid user=grid password=grid
      STALE_AFTER_SECONDS: "60"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smart_grid.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  spark-checkpoints:
